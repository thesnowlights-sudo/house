<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>英語学習</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;background:#f5f3ee;color:#2c2c2a;min-height:100vh;}
.screen{display:none;min-height:100vh;padding-bottom:80px;}
.screen.active{display:block;}
.topbar{background:#fff;padding:12px 16px 10px;border-bottom:0.5px solid #e0ddd5;position:sticky;top:0;z-index:10;}
.topbar-sub{font-size:11px;color:#888780;letter-spacing:.04em;margin-bottom:2px;}
.topbar-title{font-size:18px;font-weight:600;color:#2c2c2a;}
.content{padding:16px 16px 0;}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:12px;border:0.5px solid #e5e2da;}
.card-label{font-size:11px;color:#888780;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.card-big{font-size:26px;font-weight:700;color:#2c2c2a;}
.card-sub{font-size:14px;color:#5f5e5a;margin-top:4px;line-height:1.55;}
.pbar{background:#ede9e0;border-radius:8px;height:8px;overflow:hidden;}
.pbar-fill{background:#4a7d1a;height:100%;border-radius:8px;transition:width .5s;}
.pbar-label{font-size:11px;color:#888780;margin-top:4px;}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.97);opacity:.85;}
.btn+.btn{margin-top:10px;}
.btn-green{background:#4a7d1a;color:#fff;}
.btn-gray{background:#ede9e0;color:#2c2c2a;}
.btn-outline{background:#fff;color:#4a7d1a;border:1.5px solid #4a7d1a;padding:12px;}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.badge-done{display:inline-block;background:#c5df98;color:#3a6c10;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;}
.badge-future{display:inline-block;background:#ede9e0;color:#888780;font-size:12px;font-weight:600;padding:5px 14px;border-radius:20px;}
.day-nav{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;border:0.5px solid #e5e2da;}
.day-nav-btn{width:42px;height:42px;border-radius:50%;border:none;background:#f5f3ee;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
.day-nav-btn:active{background:#ede9e0;}
.day-nav-btn:disabled{opacity:.25;cursor:default;}
.day-nav-center{text-align:center;flex:1;}
.day-nav-chapter{font-size:11px;color:#888780;margin-bottom:2px;}
.day-nav-day{font-size:20px;font-weight:800;color:#2c2c2a;}
.day-nav-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:3px;display:inline-block;}
.badge-current{background:#4a7d1a;color:#fff;}
.badge-done-small{background:#c5df98;color:#3a6c10;}
.badge-future-small{background:#ede9e0;color:#888780;}
.step-list{margin-top:14px;}
.step-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:0.5px solid #f0ede5;}
.step-item:last-child{border-bottom:none;}
.step-num{width:26px;height:26px;border-radius:50%;background:#4a7d1a;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-text{font-size:14px;color:#2c2c2a;line-height:1.6;flex:1;}
.step-link{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:#4a7d1a;background:#f0f7e8;padding:4px 10px;border-radius:20px;border:none;cursor:pointer;}
.step-link:active{opacity:.7;}
.chapter-dots{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.ch-dot{border-radius:10px;padding:6px 10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;cursor:pointer;}
.ch-dot-done{background:#c5df98;color:#3a6c10;}
.ch-dot-now{background:#4a7d1a;color:#fff;}
.ch-dot-future{background:#ede9e0;color:#999;}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid #e5e2da;display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:100;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;}
.bnav-icon{font-size:22px;color:#aaa9a0;}
.bnav-label{font-size:10px;color:#aaa9a0;}
.bnav-item.on .bnav-icon,.bnav-item.on .bnav-label{color:#4a7d1a;}
.bnav-item.on .bnav-label{font-weight:700;}
.phrase-card{background:#fff;border-radius:20px;padding:36px 24px;text-align:center;margin-bottom:20px;border:0.5px solid #e5e2da;min-height:170px;display:flex;flex-direction:column;justify-content:center;}
.phrase-jp{font-size:22px;font-weight:700;color:#2c2c2a;line-height:1.4;}
.phrase-en{font-size:17px;font-weight:600;color:#4a7d1a;margin-top:16px;display:none;line-height:1.4;}
.phrase-en.show{display:block;}
.ring-wrap{width:130px;height:130px;margin:0 auto 20px;position:relative;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-track{fill:none;stroke:#ede9e0;stroke-width:9;}
.ring-fill{fill:none;stroke:#4a7d1a;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s;}
.ring-fill.urgent{stroke:#e24b4a;}
.ring-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:700;color:#2c2c2a;font-variant-numeric:tabular-nums;}
.ring-num.urgent{color:#e24b4a;}
.score-row{display:flex;justify-content:center;gap:20px;margin-bottom:16px;}
.score-item{text-align:center;}
.score-val{font-size:28px;font-weight:700;color:#2c2c2a;}
.score-lbl{font-size:11px;color:#888780;margin-top:2px;}
.attack-mode-badge{text-align:center;font-size:12px;font-weight:700;padding:6px 16px;border-radius:20px;margin-bottom:12px;display:inline-block;}
.attack-mode-chapter{background:#e8f4fd;color:#1a6fa8;}
.attack-mode-all{background:#f0f7e8;color:#3a6c10;}
.transcript{background:#ede9e0;border-radius:12px;padding:16px;min-height:100px;font-size:15px;color:#5f5e5a;line-height:1.7;margin-top:16px;white-space:pre-wrap;}
.rec-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e24b4a;margin-right:6px;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.set-label{font-size:13px;font-weight:600;color:#5f5e5a;margin-bottom:6px;}
.set-input{width:100%;padding:12px;border:0.5px solid #e0ddd5;border-radius:10px;font-size:14px;background:#fff;color:#2c2c2a;margin-bottom:16px;}
.set-input:focus{outline:none;border-color:#4a7d1a;}
.empty{text-align:center;padding:40px 20px;color:#888780;}
.empty-icon{font-size:44px;margin-bottom:12px;}
.empty-text{font-size:15px;line-height:1.6;}
.status-msg{text-align:center;font-size:14px;color:#888780;padding:10px;}
.status-msg.ok{color:#4a7d1a;}
.result-card{background:#fff;border-radius:20px;padding:36px 24px;text-align:center;border:0.5px solid #e5e2da;margin-bottom:16px;}
.result-score{font-size:56px;font-weight:800;line-height:1;}
.result-label{font-size:14px;color:#5f5e5a;margin-top:8px;}
.result-msg{font-size:15px;margin-top:16px;line-height:1.6;color:#2c2c2a;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:24px;padding:28px 24px;text-align:center;max-width:320px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-title{font-size:17px;font-weight:700;margin-bottom:6px;}
.modal-sub{font-size:13px;color:#888780;margin-bottom:20px;line-height:1.6;}
#qr-box{display:flex;justify-content:center;margin-bottom:20px;}
#qr-box img,#qr-box canvas{border-radius:12px;}
</style>
</head>
<body>

<div class="screen active" id="screen-home">
  <div class="topbar">
    <div class="topbar-sub">English Learning</div>
    <div class="topbar-title" id="home-title">読み込み中...</div>
  </div>
  <div class="content" id="home-content">
    <div class="status-msg">データを取得しています...</div>
  </div>
</div>

<div class="screen" id="screen-attack">
  <div class="topbar">
    <div class="topbar-sub" id="attack-sub">トレーニング</div>
    <div class="topbar-title">タイムアタック</div>
  </div>
  <div class="content" id="attack-content"></div>
</div>

<div class="screen" id="screen-speech">
  <div class="topbar">
    <div class="topbar-sub">Recording & Transcript</div>
    <div class="topbar-title">1分スピーチ</div>
  </div>
  <div class="content">
    <div class="ring-wrap" style="margin-top:8px;">
      <svg viewBox="0 0 130 130" width="130" height="130">
        <circle class="ring-track" cx="65" cy="65" r="56"/>
        <circle class="ring-fill" id="speech-ring" cx="65" cy="65" r="56"
          stroke-dasharray="351.9" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-num" id="speech-num">1:00</div>
    </div>
    <button class="btn btn-green" id="speech-btn" onclick="toggleSpeech()">録音開始</button>
    <button class="btn btn-gray" style="margin-top:10px" onclick="resetSpeech()">リセット</button>
    <div class="transcript" id="transcript">ここに文字起こしが表示されます...</div>
  </div>
</div>

<div class="screen" id="screen-settings">
  <div class="topbar"><div class="topbar-title">設定</div></div>
  <div class="content" style="padding-top:20px;">
    <div class="set-label">Google Apps Script URL</div>
    <input type="url" class="set-input" id="s-gas" placeholder="https://script.google.com/macros/s/...">
    <div class="set-label">GPT リンク</div>
    <input type="url" class="set-input" id="s-gpt" placeholder="https://chat.openai.com">
    <div class="set-label">GSS リンク</div>
    <input type="url" class="set-input" id="s-gss" placeholder="https://docs.google.com/spreadsheets/...">
    <button class="btn btn-green" onclick="saveSettings()">保存する</button>
    <button class="btn btn-gray" style="margin-top:10px;" onclick="showQR()">📱 スマホに設定を送る</button>
    <div id="settings-status" class="status-msg"></div>
  </div>
</div>

<div class="modal-overlay" id="qr-modal" onclick="closeQR(event)">
  <div class="modal">
    <div class="modal-title">📱 スマホで読み取って！</div>
    <div class="modal-sub">読み取ると設定が自動で反映されます</div>
    <div id="qr-box"></div>
    <button class="btn btn-green" onclick="document.getElementById('qr-modal').classList.remove('show')">閉じる</button>
  </div>
</div>

<nav class="bnav">
  <div class="bnav-item on" id="nav-home" onclick="showScreen('home')">
    <div class="bnav-icon">🏠</div><div class="bnav-label">ホーム</div>
  </div>
  <div class="bnav-item" id="nav-attack" onclick="startAttackAll()">
    <div class="bnav-icon">⚡</div><div class="bnav-label">タイムアタック</div>
  </div>
  <div class="bnav-item" id="nav-speech" onclick="showScreen('speech')">
    <div class="bnav-icon">🎙️</div><div class="bnav-label">スピーチ</div>
  </div>
  <div class="bnav-item" id="nav-settings" onclick="showScreen('settings')">
    <div class="bnav-icon">⚙️</div><div class="bnav-label">設定</div>
  </div>
</nav>

<script>
const CHAPTERS = [
  {ch:1, theme:'Indian food 基本'},
  {ch:2, theme:'Indian food 文化・応用'},
  {ch:3, theme:'Travel 行きたい理由'},
  {ch:4, theme:'India trip 実践'},
  {ch:5, theme:'Daily life 会話'},
  {ch:6, theme:'Making friends 雑談'},
  {ch:7, theme:'My story 自分の話'},
  {ch:8, theme:'ロールプレイ 実戦'},
];
const DAY_TYPES = {
  1:{label:'インプット＋収集', desc:'GPTと日本語で話してフレーズを集める', steps:[
    {text:'GPTを開いて、今週のテーマについて日本語で話しかける', link:'gpt'},
    {text:'GPTが使った表現・フレーズを3〜5個ピックアップする', link:null},
    {text:'GSSのフレーズシートに Phrase_EN と Phrase_JP を記録する', link:'gss'},
  ]},
  2:{label:'軽く使う', desc:'フレーズを声に出して自分の言葉で使ってみる', steps:[
    {text:'GSSのフレーズを声に出して全部読む', link:'gss'},
    {text:'気に入ったフレーズで1〜2文、自分の状況に合わせて作る', link:null},
    {text:'タイムアタックで定着を確認する', link:'attack-chapter'},
  ]},
  3:{label:'会話（メイン）', desc:'GPTと英語で3〜5分会話する', steps:[
    {text:"GPTを開いて英語で話しかける（例：Let's talk about Indian food!）", link:'gpt'},
    {text:'3〜5分、できるだけ英語で会話を続ける', link:null},
    {text:'新しく出てきた表現があればGSSに追加する', link:'gss'},
  ]},
  4:{label:'復習', desc:'今週のフレーズをまとめて定着させる', steps:[
    {text:'GSSのフレーズを最初から全部声に出して音読する', link:'gss'},
    {text:'タイムアタックで苦手なものを重点的に練習する', link:'attack-chapter'},
    {text:'🟢 習得済みになるまで繰り返す', link:null},
  ]},
  5:{label:'1分スピーチ', desc:'今週学んだ表現を全部使って1分話し続ける', steps:[
    {text:'GSSのフレーズをざっと見て今週の表現を思い出す', link:'gss'},
    {text:'「スピーチ」画面を開いて録音ボタンを押す', link:'speech'},
    {text:'1分間、今週のテーマについて英語で話し続ける（詰まってもOK！）', link:null},
  ]},
};
const TOTAL_DAYS = 40;
const CIRC_SMALL = 2 * Math.PI * 52;
const CIRC_BIG   = 2 * Math.PI * 56;

function chapterOf(d)    { return Math.ceil(d / 5); }
function dayInChapter(d) { return ((d - 1) % 5) + 1; }

let viewingDay = 0;
// タイムアタックのモード：'chapter'=今のChapterのみ, 'all'=全フレーズ
let attackMode = 'all';
let attackChapter = 1;

function applyUrlParams() {
  const p = new URLSearchParams(location.search);
  if (!p.get('gas')) return;
  if (p.get('gas')) localStorage.setItem('gasUrl', p.get('gas'));
  if (p.get('gpt')) localStorage.setItem('gptUrl', p.get('gpt'));
  if (p.get('gss')) localStorage.setItem('gssUrl', p.get('gss'));
  history.replaceState({}, '', location.pathname);
}

let cfg = {};
function loadCfg() {
  cfg = {
    gasUrl: localStorage.getItem('gasUrl') || '',
    gptUrl: localStorage.getItem('gptUrl') || 'https://chat.openai.com',
    gssUrl: localStorage.getItem('gssUrl') || '',
  };
}
function saveSettings() {
  cfg.gasUrl = document.getElementById('s-gas').value.trim();
  cfg.gptUrl = document.getElementById('s-gpt').value.trim() || 'https://chat.openai.com';
  cfg.gssUrl = document.getElementById('s-gss').value.trim();
  localStorage.setItem('gasUrl', cfg.gasUrl);
  localStorage.setItem('gptUrl', cfg.gptUrl);
  localStorage.setItem('gssUrl', cfg.gssUrl);
  const el = document.getElementById('settings-status');
  el.textContent = '✅ 保存しました';
  el.className = 'status-msg ok';
  setTimeout(() => showScreen('home'), 800);
}
function loadSettingsForm() {
  document.getElementById('s-gas').value = cfg.gasUrl;
  document.getElementById('s-gpt').value = cfg.gptUrl;
  document.getElementById('s-gss').value = cfg.gssUrl;
  document.getElementById('settings-status').textContent = '';
}
function showQR() {
  if (!cfg.gasUrl) { alert('先に設定を保存してください'); return; }
  const params = new URLSearchParams({gas:cfg.gasUrl, gpt:cfg.gptUrl, gss:cfg.gssUrl});
  const url = location.origin + location.pathname + '?' + params.toString();
  const box = document.getElementById('qr-box');
  box.innerHTML = '';
  new QRCode(box, {text:url, width:220, height:220, correctLevel:QRCode.CorrectLevel.M});
  document.getElementById('qr-modal').classList.add('show');
}
function closeQR(e) {
  if (e.target === document.getElementById('qr-modal'))
    document.getElementById('qr-modal').classList.remove('show');
}

async function gas(params) {
  if (!cfg.gasUrl) return null;
  try {
    params._t = Date.now();
    const url = cfg.gasUrl + '?' + new URLSearchParams(params).toString();
    const res = await fetch(url, {redirect:'follow'});
    return await res.json();
  } catch(e) { return null; }
}
function openUrl(url) {
  if (!url || url === '#') { alert('設定でURLを入力してください'); return; }
  window.open(url, '_blank');
}

// ナビバーからのタイムアタック → 全フレーズモード
function startAttackAll() {
  attackMode    = 'all';
  attackChapter = null;
  document.getElementById('attack-sub').textContent = '全フレーズ総復習';
  showScreen('attack');
}

// ステップリンクからのタイムアタック → 今のChapterのみ
function startAttackChapter() {
  attackMode    = 'chapter';
  attackChapter = chapterOf(viewingDay) || 1;
  document.getElementById('attack-sub').textContent = `Chapter ${attackChapter} のフレーズ`;
  showScreen('attack');
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.bnav-item').forEach(n => n.classList.remove('on'));
  document.getElementById('screen-' + name).classList.add('active');
  const navId = name === 'attack' ? 'nav-attack' : 'nav-' + name;
  if (document.getElementById(navId)) document.getElementById(navId).classList.add('on');
  if (name === 'home')     renderHome();
  if (name === 'attack')   initAttack();
  if (name === 'settings') loadSettingsForm();
}

// =============================================
//  HOME
// =============================================
let completedDays = new Set();

async function renderHome() {
  document.getElementById('home-title').textContent = '読み込み中...';
  if (cfg.gasUrl) {
    const r = await gas({action:'getProgress'});
    if (r && r.completedDays) completedDays = new Set(r.completedDays.map(Number));
  }
  let currentDay = 1;
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    if (!completedDays.has(d)) { currentDay = d; break; }
  }
  if (completedDays.size >= TOTAL_DAYS) currentDay = TOTAL_DAYS;
  if (viewingDay === 0) viewingDay = currentDay;
  renderHomeContent(currentDay);
}

function renderHomeContent(currentDay) {
  const d       = viewingDay;
  const ch      = chapterOf(d);
  const dayType = dayInChapter(d);
  const chapter = CHAPTERS[ch - 1];
  const task    = DAY_TYPES[dayType];
  const isDone  = completedDays.has(d);
  const maxDone = completedDays.size > 0 ? Math.max(...completedDays) : 0;
  let status = 'future';
  if (isDone)                           status = 'done';
  else if (d === 1 || d <= maxDone + 1) status = 'current';

  document.getElementById('home-title').textContent = `Chapter ${ch} · Day ${d}`;
  const totalDone = completedDays.size;
  const pct = Math.round(totalDone / TOTAL_DAYS * 100);

  let html = '';

  const statusLabel =
    isDone             ? '<span class="day-nav-badge badge-done-small">✅ 完了</span>' :
    status==='current' ? '<span class="day-nav-badge badge-current">▶ 今ここ</span>' :
                         '<span class="day-nav-badge badge-future-small">🔒 まだ先</span>';

  html += `<div class="day-nav">
    <button class="day-nav-btn" onclick="navDay(-1)" ${d>1?'':'disabled'}>◀</button>
    <div class="day-nav-center">
      <div class="day-nav-chapter">Chapter ${ch}「${chapter.theme}」</div>
      <div class="day-nav-day">Day ${d} <span style="font-size:13px;font-weight:400;color:#888780">/ ${TOTAL_DAYS}</span></div>
      ${statusLabel}
    </div>
    <button class="day-nav-btn" onclick="navDay(+1)" ${d<TOTAL_DAYS?'':'disabled'}>▶</button>
  </div>`;

  html += `<div class="card">
    <div class="card-label">全体進捗</div>
    <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:8px;">
      <span class="card-big">${totalDone}</span>
      <span style="font-size:15px;color:#5f5e5a">/ ${TOTAL_DAYS} Day 完了</span>
      <span style="margin-left:auto;font-size:14px;font-weight:700;color:#4a7d1a">${pct}%</span>
    </div>
    <div class="pbar"><div class="pbar-fill" style="width:${pct}%"></div></div>
    <div class="pbar-label">残り ${TOTAL_DAYS - totalDone} Day</div>
  </div>`;

  html += `<div class="card">
    <div class="card-label">Day ${d} のタスク</div>
    <div style="font-size:17px;font-weight:700;margin-bottom:4px;">${task.label}</div>
    <div class="card-sub">${task.desc}</div>
    <div class="step-list">`;

  task.steps.forEach((step, i) => {
    html += `<div class="step-item">
      <div class="step-num">${i+1}</div>
      <div class="step-text">${step.text}`;
    if (step.link === 'gpt')
      html += `<br><button class="step-link" onclick="openUrl('${cfg.gptUrl}')">GPTを開く →</button>`;
    else if (step.link === 'gss')
      html += `<br><button class="step-link" onclick="openUrl('${cfg.gssUrl}')">GSSを開く →</button>`;
    else if (step.link === 'attack-chapter')
      // ★ このChapterのフレーズだけ
      html += `<br><button class="step-link" onclick="startAttackChapter()">タイムアタック →</button>`;
    else if (step.link === 'speech')
      html += `<br><button class="step-link" onclick="showScreen('speech')">スピーチ →</button>`;
    html += `</div></div>`;
  });

  html += `</div><div style="margin-top:16px;">`;
  if (isDone) {
    html += `<span class="badge-done">✅ Day ${d} 完了！</span>`;
    if (d < TOTAL_DAYS)
      html += `<button class="btn btn-outline" style="margin-top:10px;" onclick="navDay(+1)">次のDay へ →</button>`;
  } else if (status === 'future') {
    html += `<span class="badge-future">🔒 前のDayを完了してから</span>`;
  } else {
    html += `<button class="btn btn-green" onclick="markDone(${d})">✅ やった！</button>`;
  }
  html += `</div></div>`;

  html += `<div class="card"><div class="card-label">Chapter 進捗</div><div class="chapter-dots">`;
  for (let c = 1; c <= 8; c++) {
    const cs=(c-1)*5+1, ce=c*5;
    const cd=[...completedDays].filter(x=>x>=cs&&x<=ce).length;
    const cls=cd>=5?'ch-dot-done':c===chapterOf(viewingDay)?'ch-dot-now':'ch-dot-future';
    html += `<div class="ch-dot ${cls}" onclick="jumpToChapter(${c})">Ch${c} ${cd}/5</div>`;
  }
  html += `</div></div>`;

  if (!cfg.gasUrl) {
    html += `<div class="card" style="border-color:#e24b4a;">
      <div style="font-size:14px;color:#e24b4a;font-weight:600;">⚙️ 設定が必要です</div>
      <div class="card-sub" style="margin-top:6px;">設定画面からGAS URLを入力してください。</div>
      <button class="btn btn-outline" style="margin-top:12px;" onclick="showScreen('settings')">設定を開く →</button>
    </div>`;
  }

  document.getElementById('home-content').innerHTML = html;
}

function navDay(delta) {
  const next = viewingDay + delta;
  if (next < 1 || next > TOTAL_DAYS) return;
  viewingDay = next;
  let currentDay = 1;
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    if (!completedDays.has(d)) { currentDay = d; break; }
  }
  renderHomeContent(currentDay);
}

function jumpToChapter(ch) {
  viewingDay = (ch-1)*5+1;
  let currentDay = 1;
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    if (!completedDays.has(d)) { currentDay = d; break; }
  }
  renderHomeContent(currentDay);
}

async function markDone(dayNum) {
  if (!cfg.gasUrl) { showScreen('settings'); return; }
  const ch   = chapterOf(dayNum);
  const task = DAY_TYPES[dayInChapter(dayNum)];
  const r = await gas({action:'saveProgress', dayNumber:dayNum, chapter:ch, task:task.label});
  if (r && r.success) {
    completedDays.add(dayNum);
    if (dayNum < TOTAL_DAYS) viewingDay = dayNum + 1;
    let currentDay = 1;
    for (let d = 1; d <= TOTAL_DAYS; d++) {
      if (!completedDays.has(d)) { currentDay = d; break; }
    }
    renderHomeContent(currentDay);
  } else {
    alert('保存に失敗しました。GAS URLを確認してください。');
  }
}

// =============================================
//  TIME ATTACK
// =============================================
let phrases=[], phraseStates=[], attCorrect=0, attTimer=null, attSecs=10, attRevealed=false;

async function initAttack() {
  const el = document.getElementById('attack-content');
  attCorrect=0; clearInterval(attTimer);

  if (!cfg.gasUrl) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">⚙️</div>
      <div class="empty-text">設定からGAS URLを入力してください</div>
      <button class="btn btn-outline" style="margin-top:16px;" onclick="showScreen('settings')">設定を開く →</button></div>`;
    return;
  }

  el.innerHTML = '<div class="status-msg">フレーズを取得中...</div>';

  let r;
  if (attackMode === 'chapter') {
    // 今のChapterのみ
    r = await gas({action:'getPhrases', chapter: attackChapter});
  } else {
    // 全フレーズ（chapterパラメータなし＝全件取得）
    r = await gas({action:'getPhrases'});
  }

  const modeLabel = attackMode === 'chapter'
    ? `Chapter ${attackChapter} のフレーズ`
    : '全フレーズ 総復習';

  if (!r || !r.phrases || r.phrases.length===0) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">📝</div>
      <div class="empty-text">フレーズがまだありません。</div>
      <button class="btn btn-outline" style="margin-top:16px;" onclick="openUrl('${cfg.gssUrl}')">GSSを開く →</button></div>`;
    return;
  }

  phrases=r.phrases.filter(p=>p.Phrase_JP&&p.Phrase_EN).sort(()=>Math.random()-.5);
  if (phrases.length===0) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">📝</div>
      <div class="empty-text">Phrase_JPとPhrase_ENが入力されているフレーズがありません。</div></div>`;
    return;
  }

  phraseStates=phrases.map(p=>({phrase:p, mastery:0, skipCounter:0}));

  // モードバッジをコンテンツ先頭に表示
  const badgeClass = attackMode==='chapter' ? 'attack-mode-chapter' : 'attack-mode-all';
  const badgeIcon  = attackMode==='chapter' ? '📖' : '🌐';
  el.innerHTML = `<div style="text-align:center;margin-bottom:4px;">
    <span class="attack-mode-badge ${badgeClass}">${badgeIcon} ${modeLabel}（${phrases.length}フレーズ）</span>
  </div>`;

  renderAttackQ();
}

function activeCount(){ return phraseStates.filter(s=>s.mastery<2).length; }
function getNextState(){
  const active=phraseStates.filter(s=>s.mastery<2);
  if(active.length===0) return null;
  const urgent=active.filter(s=>s.mastery===0);
  if(urgent.length>0) return urgent[Math.floor(Math.random()*urgent.length)];
  const ready=active.filter(s=>s.mastery===1&&s.skipCounter%2===0);
  if(ready.length>0) return ready[Math.floor(Math.random()*ready.length)];
  active.forEach(s=>{ if(s.mastery===1) s.skipCounter++; });
  return active[Math.floor(Math.random()*active.length)];
}

function renderAttackQ(){
  clearInterval(attTimer);
  const state=getNextState();
  if(!state){ renderAttackResult(); return; }
  attSecs=10; attRevealed=false;
  const p=state.phrase;
  const remaining=activeCount();
  const mastered=phraseStates.filter(s=>s.mastery>=2).length;

  const el = document.getElementById('attack-content');
  // モードバッジは残したまま問題を追加
  const badge = el.querySelector('.attack-mode-badge') ? el.innerHTML.split('</div>')[0]+'</div>' : '';

  el.innerHTML = badge + `
    <div class="score-row">
      <div class="score-item"><div class="score-val">${remaining}</div><div class="score-lbl">残り</div></div>
      <div class="score-item"><div class="score-val" style="color:#4a7d1a">${mastered}</div><div class="score-lbl">習得済み</div></div>
      <div class="score-item"><div class="score-val">${phrases.length}</div><div class="score-lbl">合計</div></div>
    </div>
    <div class="phrase-card">
      <div class="phrase-jp">${escHtml(p.Phrase_JP)}</div>
      <div class="phrase-en" id="att-en">${escHtml(p.Phrase_EN)}</div>
    </div>
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120" width="120" height="120">
        <circle class="ring-track" cx="60" cy="60" r="52"/>
        <circle class="ring-fill" id="att-ring" cx="60" cy="60" r="52"
          stroke-dasharray="${CIRC_SMALL.toFixed(1)}" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-num" id="att-num">10</div>
    </div>
    <button class="btn btn-green" id="att-btn" onclick="revealAttack()">答えを見る</button>`;

  window._currentState=state;
  attTimer=setInterval(()=>{
    attSecs--;
    const ring=document.getElementById('att-ring'),num=document.getElementById('att-num');
    if(!ring){clearInterval(attTimer);return;}
    ring.style.strokeDashoffset=(CIRC_SMALL*(1-attSecs/10)).toFixed(1);
    num.textContent=attSecs;
    if(attSecs<=3){ring.classList.add('urgent');num.classList.add('urgent');}
    if(attSecs<=0){clearInterval(attTimer);revealAttack();}
  },1000);
}

function revealAttack(){
  if(attRevealed)return;
  clearInterval(attTimer); attRevealed=true;
  document.getElementById('att-en').classList.add('show');
  const btn=document.getElementById('att-btn');
  if(btn)btn.style.display='none';
  const wrap=document.createElement('div');
  wrap.className='btn-grid'; wrap.style.marginTop='0';
  wrap.innerHTML=`<button class="btn btn-green" onclick="scoreAtt(true)">✅ 言えた</button>
    <button class="btn btn-gray" onclick="scoreAtt(false)">❌ 言えなかった</button>`;
  document.getElementById('attack-content').appendChild(wrap);
}

function scoreAtt(ok){
  const state=window._currentState;
  if(!state){renderAttackQ();return;}
  if(ok){state.mastery=Math.min(2,state.mastery+1);state.skipCounter=0;}
  else  {state.mastery=0;state.skipCounter=0;}
  phraseStates.forEach(s=>{if(s.mastery===1&&s!==state)s.skipCounter++;});
  renderAttackQ();
}

function renderAttackResult(){
  const total=phrases.length,mastered=phraseStates.filter(s=>s.mastery>=2).length;
  const pct=Math.round(mastered/total*100);
  const emoji=pct>=80?'🎉':pct>=50?'💪':'📚';
  const msg=pct>=80?'素晴らしい！全部習得しました 🌟':pct>=50?'いい調子！続けましょう 💪':'まだ練習が必要です。もう一回！ 📖';
  document.getElementById('attack-content').innerHTML=`
    <div class="result-card">
      <div style="font-size:48px;margin-bottom:12px;">${emoji}</div>
      <div class="card-label">習得状況</div>
      <div class="result-score" style="color:${pct>=80?'#4a7d1a':'#2c2c2a'}">${mastered}<span style="font-size:24px;font-weight:500">/${total}</span></div>
      <div class="result-label">習得済み / 全フレーズ</div>
      <div class="result-msg">${msg}</div>
    </div>
    <button class="btn btn-green" onclick="initAttack()">もう一回（リセット）</button>
    <button class="btn btn-gray" onclick="showScreen('home')">ホームへ</button>`;
}

// =============================================
//  SPEECH
// =============================================
let spTimer=null,spSecs=60,spRunning=false,spRec=null,spText='';
function toggleSpeech(){spRunning?stopSpeech():startSpeech();}
function startSpeech(){
  spRunning=true;spText='';
  document.getElementById('speech-btn').textContent='録音停止';
  document.getElementById('transcript').innerHTML='<span class="rec-dot"></span>聞いています...';
  if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    spRec=new SR();spRec.lang='en-US';spRec.continuous=true;spRec.interimResults=true;
    spRec.onresult=e=>{
      let interim='',final=spText;
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';
        else interim+=e.results[i][0].transcript;
      }
      spText=final;
      document.getElementById('transcript').textContent=(final+interim)||'聞いています...';
    };
    spRec.onerror=()=>{};spRec.start();
  }
  spTimer=setInterval(()=>{
    spSecs--;
    const m=Math.floor(spSecs/60),s=spSecs%60;
    const ring=document.getElementById('speech-ring'),num=document.getElementById('speech-num');
    if(!ring){clearInterval(spTimer);return;}
    num.textContent=`${m}:${String(s).padStart(2,'0')}`;
    ring.style.strokeDashoffset=(CIRC_BIG*(1-spSecs/60)).toFixed(1);
    if(spSecs<=10){ring.classList.add('urgent');num.classList.add('urgent');}
    if(spSecs<=0){stopSpeech();const btn=document.getElementById('speech-btn');btn.textContent='⏰ 終了！';btn.disabled=true;}
  },1000);
}
function stopSpeech(){
  spRunning=false;clearInterval(spTimer);
  if(spRec){try{spRec.stop();}catch(e){}spRec=null;}
  document.getElementById('speech-btn').textContent='録音開始';
  if(spText.trim())document.getElementById('transcript').textContent=spText.trim();
}
function resetSpeech(){
  stopSpeech();spSecs=60;spText='';
  const ring=document.getElementById('speech-ring'),num=document.getElementById('speech-num'),btn=document.getElementById('speech-btn');
  ring.style.strokeDashoffset='0';ring.classList.remove('urgent');
  num.textContent='1:00';num.classList.remove('urgent');
  btn.textContent='録音開始';btn.disabled=false;
  document.getElementById('transcript').textContent='ここに文字起こしが表示されます...';
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

applyUrlParams();
loadCfg();
viewingDay=0;
renderHome();
</script>
